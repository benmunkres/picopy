### PiCopy Configuration Options:
## Storage-Related Configuration
[STORAGE]
# interval (in seconds) to check for mounted devices
MOUNT_CHECK_INTERVAL=1

# location of mounted drives
MOUNT_LOCATION=/media/pi

# file/folder identifying the destination drive
COPY_DESTINATION_ID=PICOPY_DESTINATION

## File Copying
[FILE_COPYING]
# target file extentions, as comma separated list (case insensitive)
TARGET_FILE_EXTENTIONS=.wav

# files and/or folders to ignore while copying, as comma separated list
EXCLUDE_FILES=.Trashes,.fsevents*,System*,.Spotlight*

# minimum file size to transfer
MIN_FILE_SIZE=100k